<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غرفة هروب فيثاغورس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-v1.6.0.min.js"></script>
<style>
/* VOICE: playful classroom adventure
   IDEA: an ancient Greek study room you must escape
   PICTURE: the 3D room itself, full screen
   COLOUR and TYPE: sandstone, deep Aegean blue, gold; Cairo
   LAYOUT: scene full screen, small HUD top-right, licence footer */
html,body{margin:0;height:100%;font-family:'Cairo',system-ui,sans-serif}
#hud{position:fixed;top:12px;right:12px;z-index:10;max-width:min(330px,calc(100vw - 24px));background:rgba(18,32,48,.9);color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;line-height:1.55}
#hud h1{font-size:18px;margin:0 0 2px}
#code{font-size:24px;letter-spacing:6px;color:#f2c14e;font-weight:700;direction:ltr;display:inline-block}
#hud button{font:inherit;font-weight:700;background:#f2c14e;color:#1b2430;border:0;border-radius:8px;padding:6px 14px;min-height:40px;cursor:pointer;margin-top:6px}
#hud button:focus-visible{outline:3px solid #fff}
#hud summary{cursor:pointer;color:#f2c14e}
#foot{position:fixed;bottom:0;left:0;right:0;z-index:10;text-align:center;font-size:13px;color:#fff;background:rgba(0,0,0,.6);padding:4px 8px}
#foot a{color:#f2c14e}
.a-enter-vr{bottom:44px!important}
</style>
<script>
AFRAME.registerComponent('ctext',{
  schema:{text:{default:''},w:{default:1},h:{default:.3},bg:{default:'#fdf6e3'},fg:{default:'#1b2430'},size:{default:44},border:{default:''},kind:{default:''},dir:{default:'rtl'}},
  init(){
    this.c=document.createElement('canvas');
    this.tex=new THREE.CanvasTexture(this.c);this.tex.colorSpace=THREE.SRGBColorSpace;
    this.mesh=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:this.tex,transparent:true}));
    this.el.setObject3D('mesh',this.mesh);
  },
  update(){
    const d=this.data,P=400,W=Math.round(d.w*P),H=Math.round(d.h*P),c=this.c;
    c.width=W;c.height=H;this.mesh.scale.set(d.w,d.h,1);
    const x=c.getContext('2d');x.clearRect(0,0,W,H);
    x.fillStyle=d.bg;x.beginPath();x.roundRect(4,4,W-8,H-8,Math.min(28,H/4));x.fill();
    if(d.border){x.lineWidth=8;x.strokeStyle=d.border;x.stroke()}
    let top=0,avail=H;
    if(d.kind==='tri'){drawTri(x,W,H*.55);top=H*.52;avail=H*.46}
    x.fillStyle=d.fg;x.direction=d.dir;x.textAlign='center';x.textBaseline='middle';
    x.font='700 '+d.size+'px Cairo, sans-serif';
    const lines=[];
    String(d.text).split('\n').forEach(p=>{let cur='';p.split(' ').forEach(w=>{const t=cur?cur+' '+w:w;if(x.measureText(t).width>W-60&&cur){lines.push(cur);cur=w}else cur=t});lines.push(cur)});
    const lh=d.size*1.35;let y=top+avail/2-(lines.length-1)*lh/2;
    lines.forEach(l=>{x.fillText(l,W/2,y);y+=lh});
    this.tex.needsUpdate=true;
  },
  remove(){this.el.removeObject3D('mesh');this.tex.dispose()}
});
function drawTri(x,W,H){
  const s=Math.min(W*.5,H*.8)/8,ox=W/2-4*s,oy=H*.12+6*s;
  x.save();x.strokeStyle='#1f4e79';x.lineWidth=6;x.fillStyle='rgba(242,193,78,.4)';
  x.beginPath();x.moveTo(ox,oy);x.lineTo(ox+8*s,oy);x.lineTo(ox,oy-6*s);x.closePath();x.fill();x.stroke();
  x.strokeRect(ox,oy-.7*s,.7*s,.7*s);
  x.fillStyle='#1b2430';x.font='700 34px Cairo, sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.fillText('8 سم',ox+4*s,oy+26);x.fillText('6 سم',ox-56,oy-3*s);
  x.fillStyle='#c0392b';x.font='700 44px Cairo, sans-serif';x.fillText('؟',ox+4*s+26,oy-3*s-22);x.restore();
}
</script>
</head>
<body>
<div id="hud">
  <h1>غرفة هروب فيثاغورس</h1>
  <div>الرمز: <span id="code">_ _ _</span></div>
  <details><summary>كيف ألعب؟</summary>
  نظارة Quest: اضغط زر VR، ثم وجّه الليزر واضغط الزناد.<br>
  Chromebook: اسحب بالماوس للنظر، W A S D للمشي، واضغط على الأشياء.<br>
  حلّ ألغاز اللوح والصندوق والخزنة، ثم افتح الباب خلفك.</details>
  <button id="again" type="button">العب من جديد</button>
</div>
<div id="foot">© جواد النشاشيبي — مجاني للاستخدام التعليمي، غير مخصص للبيع · <a href="https://creativecommons.org/licenses/by-nc/4.0/deed.ar">CC BY-NC 4.0</a></div>

<a-scene renderer="colorManagement:true;antialias:true" cursor="rayOrigin: mouse" raycaster="objects: .clickable" background="color:#fff3c4" loading-screen="dotsColor:#d4a017;backgroundColor:#1b2430">
  <a-entity light="type:ambient;intensity:0.75"></a-entity>
  <a-entity light="type:point;intensity:1.3;distance:16" position="0 3.2 0"></a-entity>
  <a-plane rotation="-90 0 0" width="8" height="8" color="#5b3a29"></a-plane>
  <a-circle rotation="-90 0 0" position="0 0.01 0" radius="1.7" color="#1f4e79"></a-circle>
  <a-ring rotation="-90 0 0" position="0 0.02 0" radius-inner="1.45" radius-outer="1.55" color="#d4a017"></a-ring>
  <a-plane rotation="90 0 0" position="0 3.5 0" width="8" height="8" color="#efe3c8"></a-plane>
  <a-plane position="0 1.75 -4" width="8" height="3.5" color="#d9c39a"></a-plane>
  <a-plane position="-4 1.75 0" rotation="0 90 0" width="8" height="3.5" color="#cfb98f"></a-plane>
  <a-plane position="4 1.75 0" rotation="0 -90 0" width="8" height="3.5" color="#cfb98f"></a-plane>
  <a-plane position="-2.3 1.75 4" rotation="0 180 0" width="3.4" height="3.5" color="#d9c39a"></a-plane>
  <a-plane position="2.3 1.75 4" rotation="0 180 0" width="3.4" height="3.5" color="#d9c39a"></a-plane>
  <a-plane position="0 2.9 4" rotation="0 180 0" width="1.2" height="1.2" color="#d9c39a"></a-plane>
  <a-plane position="0 1.5 4.8" rotation="0 180 0" width="4" height="3" color="#fffbe6"></a-plane>
  <a-cylinder position="-3.6 1.75 -3.6" radius="0.22" height="3.5" color="#f4ead5"></a-cylinder>
  <a-cylinder position="3.6 1.75 -3.6" radius="0.22" height="3.5" color="#f4ead5"></a-cylinder>
  <a-cylinder position="-3.6 1.75 3.6" radius="0.22" height="3.5" color="#f4ead5"></a-cylinder>
  <a-cylinder position="3.6 1.75 3.6" radius="0.22" height="3.5" color="#f4ead5"></a-cylinder>

  <a-box id="board" class="clickable" position="0 1.8 -3.92" width="2.7" height="1.6" depth="0.1" color="#b08d57"></a-box>

  <a-entity id="chest" class="clickable" position="-3.2 0 0" rotation="0 90 0">
    <a-box position="0 0.28 0" width="1.1" height="0.55" depth="0.6" color="#7a4a2a"></a-box>
    <a-box position="0 0.6 0" width="1.12" height="0.12" depth="0.62" color="#6a3d22"></a-box>
    <a-box position="0 0.34 0" width="0.12" height="0.72" depth="0.64" color="#d4a017"></a-box>
  </a-entity>

  <a-entity id="safe" class="clickable" position="3.3 0 0" rotation="0 -90 0">
    <a-box position="0 0.5 0" width="0.8" height="1" depth="0.7" color="#5f6b75"></a-box>
    <a-cylinder position="0 0.62 0.36" rotation="90 0 0" radius="0.12" height="0.05" color="#d4a017"></a-cylinder>
    <a-box position="0.25 0.4 0.37" width="0.06" height="0.22" depth="0.05" color="#d4a017"></a-box>
  </a-entity>

  <a-entity id="doorPivot" position="0.6 0 3.97">
    <a-box id="door" class="clickable" position="-0.6 1.15 0" width="1.2" height="2.3" depth="0.08" color="#1f4e79"></a-box>
    <a-sphere position="-1.05 1.1 -0.07" radius="0.05" color="#d4a017"></a-sphere>
  </a-entity>
  <a-box id="keypadBox" class="clickable" position="-1.0 1.3 3.95" width="0.26" height="0.36" depth="0.05" color="#1b2430"></a-box>

  <a-entity id="rig">
    <a-entity camera look-controls wasd-controls="acceleration:20" position="0 1.6 0"></a-entity>
    <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 15; lineColor: #d4a017"></a-entity>
    <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 15; lineColor: #d4a017"></a-entity>
  </a-entity>
</a-scene>

<script>
{
const $=s=>document.querySelector(s);
const scene=$('a-scene');
const DIG=['3','7','4'],ORD=['الأول','الثاني','الثالث'];
const Q=[
  {obj:'#board',pos:'0 1.45 -2.1',rot:'0 0 0',kind:'tri',q:'مثلث قائم الزاوية طولا ضلعيه القائمين 6 سم و 8 سم. ما طول الوتر؟',o:['14 سم','10 سم','12 سم'],a:1,hint:'تذكّر: أ² + ب² = ج²'},
  {obj:'#chest',pos:'-2.0 1.45 0',rot:'0 90 0',q:'سلّم طوله 13 م يستند إلى حائط، وأسفله يبعد 5 م عن الحائط. إلى أي ارتفاع يصل؟',o:['12 م','8 م','18 م'],a:0,hint:'الوتر هو السلّم: ب² = ج² − أ²'},
  {obj:'#safe',pos:'2.0 1.45 0',rot:'0 -90 0',q:'أيّ ثلاثية أطوال تكوّن مثلثًا قائم الزاوية؟',o:['4، 5، 6','5، 6، 7','7، 24، 25'],a:2,hint:'هل مجموع مربعي الضلعين الأصغرين يساوي مربع الأكبر؟'}
];
const solved=[false,false,false];let entry='',won=false;const panels=[];

let ac;
function beep(f,t=.25){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t);o.start();o.stop(ac.currentTime+t)}catch(e){}}
function refresh(){document.querySelectorAll('[raycaster]').forEach(r=>{const c=r.components.raycaster;if(c)c.refreshObjects()})}
function card(parent,pos,o,rot){const e=document.createElement('a-entity');e.setAttribute('ctext',o);e.setAttribute('position',pos);if(rot)e.setAttribute('rotation',rot);parent.appendChild(e);return e}
function btn(parent,pos,o,fn){
  const e=card(parent,pos,Object.assign({bg:'#1f4e79',fg:'#fff',size:40},o));e.dataset.btn='1';
  e.addEventListener('click',()=>{if(!e.parentNode.dataset.open)return;beep(660,.08);fn(e)});
  e.addEventListener('mouseenter',()=>e.object3D.scale.set(1.08,1.08,1));
  e.addEventListener('mouseleave',()=>e.object3D.scale.set(1,1,1));
  return e;
}
function panel(pos,rot){const p=document.createElement('a-entity');p.setAttribute('position',pos);p.setAttribute('rotation',rot);p.setAttribute('visible',false);scene.appendChild(p);return p}
function setOpen(p,on){
  if(on)document.querySelectorAll('[data-open]').forEach(o=>o!==p&&setOpen(o,false));
  p.setAttribute('visible',on);if(on)p.dataset.open='1';else delete p.dataset.open;
  p.querySelectorAll('[data-btn]').forEach(b=>b.classList.toggle('clickable',on));refresh();
}
function status(){
  const s=DIG.map((d,i)=>solved[i]?d:'_').join(' ');
  $('#code').textContent=s;plate.setAttribute('ctext','text',s);
}

function build(){
  // labels and decorations
  card($('#board'),'0 0 0.06',{text:'أ² + ب² = ج²\nاضغط على اللوح',w:2.5,h:1.4,bg:'#24443a',fg:'#fdf6e3',size:64});
  card($('#chest'),'0 1.05 0',{text:'الصندوق',w:.7,h:.2,size:40,bg:'#d4a017'});
  card($('#safe'),'0 1.3 0',{text:'الخزنة',w:.6,h:.2,size:40,bg:'#d4a017'});
  card(scene,'-1.0 1.72 3.93',{text:'لوحة الباب',w:.6,h:.18,size:36,bg:'#d4a017'},'0 180 0');
  card(scene,'0 3.05 3.95',{text:'الرمز',w:.5,h:.16,size:36,bg:'#d4a017'},'0 180 0');
  window.plate=card(scene,'0 2.75 3.95',{text:'_ _ _',w:.9,h:.32,size:70,bg:'#1b2430',fg:'#f2c14e',dir:'ltr'},'0 180 0');
  card(scene,'2.6 0.6 3.97',{text:'© جواد النشاشيبي\nمجاني للاستخدام التعليمي، غير مخصص للبيع\nCC BY-NC 4.0',w:1.6,h:.4,size:28,bg:'#efe3c8'},'0 180 0');

  // puzzles
  Q.forEach((q,i)=>{
    const p=panel(q.pos,q.rot),qh=q.kind?1.05:.62;
    card(p,`0 ${.2+qh/2} 0`,{text:q.q,w:1.7,h:qh,kind:q.kind||'',size:38,border:'#d4a017'});
    q.o.forEach((t,k)=>btn(p,`${.58-k*.58} 0 0`,{text:t,w:.52,h:.24},b=>answer(i,k,b)));
    p.msg=card(p,'0 -.3 0',{text:'اختر الإجابة الصحيحة',w:1.7,h:.24,size:32,bg:'#fff8e7'});
    btn(p,'0 -.6 0',{text:'إغلاق',w:.42,h:.2,size:32,bg:'#6b7785'},()=>setOpen(p,false));
    panels.push(p);
    $(q.obj).addEventListener('click',()=>{if(!won)setOpen(p,true)});
  });

  // keypad
  window.kp=panel('0 1.45 2.3','0 180 0');
  card(kp,'0 .92 0',{text:'أدخل رمز الباب (3 أرقام)',w:1.2,h:.22,size:36,border:'#d4a017'});
  kp.disp=card(kp,'0 .62 0',{text:'_ _ _',w:1.0,h:.3,size:64,bg:'#1b2430',fg:'#f2c14e',dir:'ltr'});
  ['1','2','3','4','5','6','7','8','9','مسح','0','فتح'].forEach((t,n)=>{
    const r=Math.floor(n/3),c=n%3;
    btn(kp,`${(c-1)*.3} ${.32-r*.24} 0`,{text:t,w:.27,h:.2,size:t.length>1?32:52,bg:t==='فتح'?'#2e8b57':t==='مسح'?'#6b7785':'#1f4e79'},()=>key(t));
  });
  kp.msg=card(kp,'0 -.66 0',{text:'حلّ الألغاز لتعرف الأرقام',w:1.4,h:.22,size:30,bg:'#fff8e7'});
  btn(kp,'0 -.94 0',{text:'إغلاق',w:.42,h:.2,size:32,bg:'#6b7785'},()=>setOpen(kp,false));
  ['#door','#keypadBox'].forEach(s=>$(s).addEventListener('click',()=>{if(!won)setOpen(kp,true)}));

  // welcome
  const wp=panel('0 1.55 -1.8','0 0 0');
  card(wp,'0 .2 0',{text:'أنت محبوس في غرفة فيثاغورس!\nحلّ ألغاز اللوح والصندوق والخزنة لتجمع رمز الباب.\nالباب خلفك. بالتوفيق!',w:1.8,h:.75,size:40,border:'#d4a017'});
  btn(wp,'0 -.38 0',{text:'ابدأ',w:.5,h:.22,size:44,bg:'#2e8b57'},()=>setOpen(wp,false));
  setOpen(wp,true);
  status();
}

function answer(i,k,b){
  const p=panels[i],q=Q[i];if(solved[i])return;
  if(k===q.a){
    solved[i]=true;beep(880,.4);b.setAttribute('ctext','bg','#2e8b57');
    p.msg.setAttribute('ctext',{text:`أحسنت! الرقم ${ORD[i]} هو ${DIG[i]}`,bg:'#d8f3dc'});
    $(q.obj).querySelectorAll('a-box').forEach(x=>x.setAttribute('material','emissive','#1d6b40'));
    if(q.obj==='#board')$(q.obj).setAttribute('material','emissive','#1d6b40');
    status();
  }else{
    beep(200,.3);b.setAttribute('ctext','bg','#b03a2e');
    p.msg.setAttribute('ctext',{text:'ليس بعد… '+q.hint,bg:'#fde2e1'});
    setTimeout(()=>b.setAttribute('ctext','bg','#1f4e79'),900);
  }
}
function key(t){
  if(won)return;
  if(t==='مسح')entry='';
  else if(t==='فتح'){
    if(entry===DIG.join('')){win();return}
    beep(200,.3);kp.msg.setAttribute('ctext',{text:entry.length<3?'الرمز من 3 أرقام':'رمز خطأ! حلّ الألغاز لتعرف الأرقام',bg:'#fde2e1'});entry='';
  }else if(entry.length<3)entry+=t;
  kp.disp.setAttribute('ctext','text',(entry+'___').slice(0,3).split('').join(' '));
}
function win(){
  won=true;[523,659,784,1047].forEach((f,n)=>setTimeout(()=>beep(f,.3),n*160));
  kp.disp.setAttribute('ctext',{text:DIG.join(' '),fg:'#7ee2a8'});
  kp.msg.setAttribute('ctext',{text:'هربت! أحسنت يا بطل فيثاغورس',bg:'#d8f3dc',size:34});
  $('#doorPivot').setAttribute('animation',{property:'rotation',to:'0 -100 0',dur:1600,easing:'easeOutCubic'});
  $('#code').textContent='هربت!';
}

$('#again').addEventListener('click',()=>location.reload());
const fontReady=Promise.race([document.fonts.load('700 40px Cairo'),new Promise(r=>setTimeout(r,2500))]).catch(()=>{});
const sceneReady=new Promise(r=>scene.hasLoaded?r():scene.addEventListener('loaded',r));
Promise.all([fontReady,sceneReady]).then(build);
}
</script>
</body>
</html>
